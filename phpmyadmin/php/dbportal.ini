; phpMyAdmin PHP settings for DB Portal
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
allow_url_fopen = Off
allow_url_include = Off

; Request parameters (such as which server a page belongs to) come from the URL and form only, never
; from a cookie, which another site under the same domain could set.
request_order = "GP"

; A rogue "database server" must never be able to read files from this container.
mysqli.allow_local_infile = Off

; No program execution from web requests. (The SSH tunnel service runs separately.)
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl

; Large imports; the portal's admin limit is enforced before requests reach phpMyAdmin.
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 300
max_input_vars = 10000

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_only_cookies = 1
