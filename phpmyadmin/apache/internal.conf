# Internal API for the portal (connection tests). Not routed by the gateway; protected by PMA_TOKEN;
# the network guard only lets the internal network reach this port.
<VirtualHost *:8081>
    DocumentRoot /opt/dbportal/internal
    <Directory /opt/dbportal/internal>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>
