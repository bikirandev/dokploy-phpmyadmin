# Apache hardening for phpMyAdmin
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

<Directory /var/www/html>
    Options -Indexes -FollowSymLinks
    AllowOverride None
</Directory>

# Internal phpMyAdmin directories are never served.
<DirectoryMatch "^/var/www/html/(libraries|templates|vendor|setup|sql|po|examples|test|tmp)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "(^\.|\.(sql|log|bak|ini|lock|md|json|neon|xml|dist)$|^(composer|package)\.)">
    Require all denied
</FilesMatch>

# The portal's real client address arrives in X-Real-IP from the gateway.
LogFormat "%{X-Real-IP}i %t \"%r\" %>s %b %D" dbportal
CustomLog /dev/stdout dbportal
